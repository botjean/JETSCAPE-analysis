# Figure 2 published-frame bin selection; no detector smearing or shape normalization.
sqrt_s: 5020
jet_pt: [200, 251]
centrality: [0, 10]
# Preserve the existing Hybrid input convention. decay_gg is a sensitivity test.
pi0_treatment: keep
pi0_decay_seed: 0
# Match the old weighted per-jet histogram errors. event is an explicit alternative.
mc_error: per_jet
# Same first-passing Lund split as GroomerShop, using the measurement's kt tree.
grooming: lund
# Preserve negative composite signs; the old default marker 0 is diagnostic-only.
negative_recombiner: sign_preserving
observables:
  dr12_atlas:
    column: 1
    edges: [0, 0.0025, 0.01, 0.0225, 0.04, 0.0625, 0.09, 0.1225, 0.16, 0.2025, 0.25, 0.3025, 0.4225, 0.64, 0.81, 1]
  sqrt_d12_atlas:
    column: 2
    edges: [0.1, 0.151392, 0.229195, 0.346984, 0.525306, 0.795271, 1.20398, 1.82272, 2.75946, 4.1776, 6.32456, 9.57487, 14.4956, 21.9452, 33.2232, 50.2973, 76.1462, 115.279]
