name: ATLAS dr12 optional analysis
on:
  pull_request:
    paths:
      - 'jetscape_analysis/analysis/atlas_dr12.*'
      - 'jetscape_analysis/analysis/reader/**'
      - 'scripts/*atlas_dr12.py'
      - 'config/atlas_dr12_5020.yaml'
      - 'requirements-atlas-dr12.txt'
      - 'tests/**'
      - '.github/workflows/atlas-dr12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-analysis:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-atlas-dr12.txt
      - run: python -m pip install -r requirements-atlas-dr12.txt
      - run: python scripts/build_atlas_dr12.py
      - run: python -c 'from jetscape_analysis.analysis import _atlas_dr12'
      - run: python -m pytest -q --junitxml=validation/atlas_dr12/tests.xml
      - run: python scripts/smoke_atlas_dr12.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-dr12-validation
          path: validation/atlas_dr12/
